services:
  postgres:
    image: postgres:16
    container_name: jobhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhub
      POSTGRES_USER: jobhub
      POSTGRES_PASSWORD: jobhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhub -d jobhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: